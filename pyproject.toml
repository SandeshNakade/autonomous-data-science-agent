[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-data-science-agent"
version = "0.1.0"
description = "A controlled, auditable autonomous data-science prototype."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Academic Prototype Team"}]
dependencies = [
  "fastapi>=0.110",
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.2",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
mlops = ["dvc>=3.0", "evidently>=0.4", "mlflow>=2.10"]
boosting = ["xgboost>=2.0"]
llm = ["openai>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
autods = "autods.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
